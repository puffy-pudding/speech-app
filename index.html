<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語スピーチ＆文章 暗記プレイヤー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 1.2rem; text-align: center; color: #2c3e50; }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }
    label { font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px; }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .row select { padding: 6px; border-radius: 6px; border: 1px solid #ccc; }
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-primary { background: #3498db; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    #text-display {
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .sentence { padding: 6px; border-radius: 6px; margin-bottom: 4px; }
    .active { background-color: #ffeaa7; font-weight: bold; border-left: 4px solid #fdcb6e; }
    .japanese-text { color: #666; font-size: 0.85rem; display: block; }
    .status-badge {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: #eee;
      margin-left: 5px;
    }
    .status-speaking { background: #74b9ff; color: white; }
    .status-pausing { background: #fab1a0; color: white; }
  </style>
</head>
<body>

  <h1>🎧 スピーチ＆英文 暗記プレイヤー</h1>

  <div class="card">
    <label for="input-text">テキスト入力（長文をそのまま貼っても1文ずつ分割されます）</label>
    <textarea id="input-text" placeholder="例:
This is the first sentence. This is the second sentence!
これは最初の文です。これは2番目の文です！"></textarea>
    
    <div class="toggle-container">
      <span>日本語訳も読み上げる</span>
      <input type="checkbox" id="read-jp" checked>
    </div>

    <div class="row">
      <label>ポーズ倍率:</label>
      <select id="pause-scale">
        <option value="0.8">シャドーイング (0.8倍)</option>
        <option value="1.3" selected>リピーティング (1.3倍)</option>
        <option value="2.0">じっくり (2.0倍)</option>
      </select>
      
      <label>速度:</label>
      <select id="rate">
        <option value="0.8">0.8x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.2">1.2x</option>
      </select>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="startPlay()">再生開始</button>
      <button class="btn-danger" onclick="stopPlay()">停止</button>
    </div>
  </div>

  <div class="card">
    <label>📜 現在テキスト <span id="status-tag" class="status-badge">待機中</span></label>
    <div id="text-display">ここに文章が表示されます...</div>
  </div>

  <script>
    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let pauseTimer = null;

    // 英文をピリオド・!・?で1文ずつ分割する関数
    function splitEnglishSentences(text) {
      // . ! ? の後ろで分割（ただし Mr. や Dr. などの省略表現の保護対応）
      const rawSentences = text.match(/[^.!?]+[.!?]+["'”’]?|[^.!?]+$/g) || [text];
      return rawSentences.map(s => s.trim()).filter(s => s.length > 0);
    }

    function parseInput() {
      const rawText = document.getElementById("input-text").value.trim();
      if (!rawText) return [];
      
      const lines = rawText.split("\n").filter(l => l.trim() !== "");
      let result = [];
      
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        let isEnglish = /[a-zA-Z]/.test(line);
        
        if (isEnglish) {
          // 英文を行単位だけでなく、文末記号(. ! ?)でさらに1文ずつ細かく分割
          let enSentences = splitEnglishSentences(line);
          
          let nextLine = lines[i+1] ? lines[i+1].trim() : "";
          let nextIsJp = nextLine && !/[a-zA-Z]/.test(nextLine);
          let jpSentences = nextIsJp ? nextLine.split(/[。！？]/).filter(s => s.trim() !== "") : [];

          // 分割した英文ごとに要素を作成
          enSentences.forEach((enSub, idx) => {
            result.push({
              en: enSub,
              jp: jpSentences[idx] ? jpSentences[idx] + "。" : (idx === 0 && nextIsJp ? nextLine : "")
            });
          });

          if (nextIsJp) i++; // 和訳行をスキップ
        }
      }
      return result;
    }

    function updateStatus(text, className) {
      const tag = document.getElementById("status-tag");
      tag.innerText = text;
      tag.className = "status-badge " + (className || "");
    }

    function renderTextDisplay() {
      const container = document.getElementById("text-display");
      container.innerHTML = "";
      sentences.forEach((s, idx) => {
        const div = document.createElement("div");
        div.className = "sentence " + (idx === currentIndex ? "active" : "");
        div.id = "sent-" + idx;
        div.innerHTML = `<div>${s.en}</div>${s.jp ? `<span class="japanese-text">${s.jp}</span>` : ""}`;
        container.appendChild(div);
      });
      
      const activeElem = document.getElementById("sent-" + currentIndex);
      if (activeElem) activeElem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function startPlay() {
      stopPlay();
      sentences = parseInput();
      if (sentences.length === 0) {
        alert("テキストを入力してください");
        return;
      }
      currentIndex = 0;
      isPlaying = true;
      playStep();
    }

    function stopPlay() {
      isPlaying = false;
      if (pauseTimer) clearTimeout(pauseTimer);
      if (synth) synth.cancel();
      updateStatus("停止中", "");
    }

    function playStep() {
      if (!isPlaying) return;
      if (currentIndex >= sentences.length) {
        currentIndex = 0; // ループ再生
      }

      renderTextDisplay();
      const current = sentences[currentIndex];
      const readJp = document.getElementById("read-jp").checked;
      const rate = parseFloat(document.getElementById("rate").value);
      const pauseScale = parseFloat(document.getElementById("pause-scale").value);

      // 1. 英文読み上げ
      updateStatus("音声再生中...", "status-speaking");
      let utterEn = new SpeechSynthesisUtterance(current.en);
      utterEn.lang = "en-US";
      utterEn.rate = rate;

      let startTime = Date.now();

      utterEn.onend = () => {
        if (!isPlaying) return;
        
        let spokenDuration = Date.now() - startTime;
        let minDuration = (current.en.length * 100) / rate;
        let actualDuration = Math.max(spokenDuration, minDuration);
        
        let pauseTime = Math.max(1200, actualDuration * pauseScale);

        // 2. 日本語読み上げ（設定ONの場合）
        if (readJp && current.jp) {
          let utterJp = new SpeechSynthesisUtterance(current.jp);
          utterJp.lang = "ja-JP";
          utterJp.rate = 1.0;
          
          utterJp.onend = () => {
            if (!isPlaying) return;
            startPause(pauseTime);
          };
          synth.speak(utterJp);
        } else {
          startPause(pauseTime);
        }
      };

      utterEn.onerror = () => {
        if (!isPlaying) return;
        startPause(2000);
      };

      synth.speak(utterEn);
    }

    function startPause(duration) {
      if (!isPlaying) return;
      updateStatus(`ポーズ中 (${(duration/1000).toFixed(1)}秒)...`, "status-pausing");
      
      pauseTimer = setTimeout(() => {
        if (!isPlaying) return;
        currentIndex++;
        playStep();
      }, duration);
    }
  </script>
</body>
</html>
