<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語スピーチプレイヤー</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 12px;
            text-align: center;
            color: var(--primary-color);
        }

        .instruction {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 12px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #64748b;
        }

        select, input[type="range"] {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #fff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.9rem;
            text-align: center;
            color: #64748b;
            min-height: 1.2em;
        }

        .display-box {
            margin-top: 16px;
            padding: 14px;
            background: #f1f5f9;
            border-radius: 8px;
            min-height: 4em;
        }

        .sentence-en {
            font-size: 1.15rem;
            font-weight: bold;
            line-height: 1.4;
            color: #1e293b;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .sentence-ja {
            font-size: 0.95rem;
            color: #475569;
            line-height: 1.4;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>English Speech Player</h1>
    <div class="instruction">
        【使い方】英語のみ、または「英語の行のすぐ下に日本語訳」を交互に入力しても動作します。<br>例（訳ありの場合）：<br>Hello, how are you?<br>こんにちは、お元気ですか？
    </div>
    
    <textarea id="text-input" placeholder="ここに英文を入力してください..."></textarea>

    <div class="controls">
        <div class="control-group">
            <label for="rate">再生速度: <span id="rate-val">1.0</span>x</label>
            <input type="range" id="rate" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label for="pause-mode">文間のポーズ</label>
            <select id="pause-mode">
                <option value="none">ポーズなし (0秒)</option>
                <option value="short">ポーズあり (短め)</option>
                <option value="normal" selected>ポーズあり (標準・可変)</option>
                <option value="long">ポーズあり (長め)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="loop-mode">再生回数</label>
            <select id="loop-mode">
                <option value="1">1回</option>
                <option value="2">2回</option>
                <option value="3" selected>3回</option>
                <option value="4">4回</option>
                <option value="5">5回</option>
                <option value="infinite">無限ループ (永遠)</option>
            </select>
        </div>
    </div>

    <label class="checkbox-group">
        <input type="checkbox" id="show-ja-toggle" checked>
        日本語訳を画面に表示する
    </label>

    <div class="btn-group">
        <button id="play-btn" class="btn-primary">再生</button>
        <button id="stop-btn" class="btn-secondary" disabled>停止</button>
    </div>

    <div id="status" class="status">準備完了</div>
    
    <div class="display-box">
        <div id="current-en" class="sentence-en">再生される英文がここに表示されます</div>
        <div id="current-ja" class="sentence-ja" style="display: none;">日本語訳がここに表示されます</div>
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');
    const rateInput = document.getElementById('rate');
    const rateVal = document.getElementById('rate-val');
    const pauseMode = document.getElementById('pause-mode');
    const loopMode = document.getElementById('loop-mode');
    const showJaToggle = document.getElementById('show-ja-toggle');
    const statusDiv = document.getElementById('status');
    const currentEnDiv = document.getElementById('current-en');
    const currentJaDiv = document.getElementById('current-ja');

    let pairs = []; 
    let currentIndex = 0;
    let currentRepeatCount = 1;
    let isPlaying = false;
    let currentUtterance = null;
    let pauseTimeout = null;
    let wakeLock = null;

    rateInput.addEventListener('input', () => {
        rateVal.textContent = rateInput.value;
    });

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.warn('Wake Lock Error:', err);
            }
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release().then(() => {
                wakeLock = null;
            });
        }
    }

    // テキスト解析（英語のみ、または 英語+日本語の交互入力の両方に対応）
    function parseText(text) {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        let result = [];
        
        // 英語の文（. ! ? や改行など）できれいに分割されているかを判定
        // 各行が「アルファベットを含むか」で英語行と日本語行を賢く判別する
        let i = 0;
        while (i < lines.length) {
            let currentLine = lines[i];
            
            // もし英語の文章の中にピリオドが無く、次の行とペアになっている形式の場合
            let nextLine = (i + 1 < lines.length) ? lines[i + 1] : "";
            
            // 判定：次の行が日本語（ひらがな・カタカナ・漢字を含む）っぽい場合、あるいは交互入力のルールに従う場合
            // ここではシンプルに、ユーザーが「英語のみ」を入れた場合でも1行ずつ、または記号で分割できるようにする
            // ユーザーが「英語の行」「日本語の行」を交互に入れていると仮定しつつ、日本語が無い単独の行にも対応する
            
            // 日本語判定（簡易）：ひらがな・カタカナ・漢字が含まれるか
            const hasJapanese = /[ひらがなカタカナ漢字]/.test(nextLine) || /[ぁ-んァ-ンー一-龯]/.test(nextLine);

            if (hasJapanese) {
                result.push({ en: currentLine, ja: nextLine });
                i += 2;
            } else {
                // 日本語がない場合は、この行自体を英語として扱い、次へ進む
                // さらに、一つの行にピリオド区切りで複数の英文がある場合も想定してピリオドで細かく割る
                const subSentences = currentLine.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);
                if (subSentences.length > 1) {
                    subSentences.forEach(sub => {
                        result.push({ en: sub, ja: "" });
                    });
                } else {
                    result.push({ en: currentLine, ja: "" });
                }
                i += 1;
            }
        }
        return result;
    }

    function calculatePauseDuration(sentence) {
        const mode = pauseMode.value;
        if (mode === 'none') return 0;

        const wordCount = sentence.trim().split(/\s+/).length;
        let basePause = wordCount * 300;
        basePause = Math.max(1000, Math.min(basePause, 15000));

        if (mode === 'short') return basePause * 0.8;
        if (mode === 'long') return basePause * 1.3;
        return basePause;
    }

    function speakNext() {
        if (!isPlaying) return;

        if (currentIndex >= pairs.length) {
            const maxLoop = loopMode.value;
            if (maxLoop === 'infinite') {
                currentIndex = 0;
            } else {
                if (currentRepeatCount < parseInt(maxLoop)) {
                    currentRepeatCount++;
                    currentIndex = 0;
                } else {
                    stopPlayback();
                    statusDiv.textContent = "再生終了";
                    return;
                }
            }
        }

        const currentPair = pairs[currentIndex];
        currentEnDiv.textContent = currentPair.en;
        
        if (showJaToggle.checked && currentPair.ja) {
            currentJaDiv.textContent = currentPair.ja;
            currentJaDiv.style.display = 'block';
        } else {
            currentJaDiv.textContent = "";
            currentJaDiv.style.display = 'none';
        }

        const loopInfo = loopMode.value === 'infinite' ? '∞' : `${currentRepeatCount}/${loopMode.value}回`;
        statusDiv.textContent = `再生中 [周回: ${loopInfo}] (文: ${currentIndex + 1}/${pairs.length})`;

        currentUtterance = new SpeechSynthesisUtterance(currentPair.en);
        currentUtterance.lang = 'en-US';
        currentUtterance.rate = parseFloat(rateInput.value);

        currentUtterance.onend = () => {
            if (!isPlaying) return;
            currentIndex++;
            
            const pauseMs = calculatePauseDuration(currentPair.en);
            if (pauseMs === 0) {
                speakNext();
            } else {
                const secondsText = (pauseMs / 1000).toFixed(1);
                statusDiv.textContent = `ポーズ中 (${secondsText}秒)...`;
                pauseTimeout = setTimeout(speakNext, pauseMs);
            }
        };

        currentUtterance.onerror = (e) => {
            console.error('Speech synthesis error:', e);
            if (isPlaying) {
                currentIndex++;
                speakNext();
            }
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    playBtn.addEventListener('click', async () => {
        const text = textInput.value;
        if (!text.trim()) return;

        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);

        pairs = parseText(text);
        if (pairs.length === 0) return;

        currentIndex = 0;
        currentRepeatCount = 1;
        isPlaying = true;

        playBtn.disabled = true;
        stopBtn.disabled = false;
        pauseMode.disabled = true;
        loopMode.disabled = true;
        textInput.disabled = true;

        await requestWakeLock();
        speakNext();
    });

    function stopPlayback() {
        isPlaying = false;
        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);
        releaseWakeLock();

        playBtn.disabled = false;
        stopBtn.disabled = true;
        pauseMode.disabled = false;
        loopMode.disabled = false;
        textInput.disabled = false;

        statusDiv.textContent = "停止中";
    }

    stopBtn.addEventListener('click', stopPlayback);

    showJaToggle.addEventListener('change', () => {
        if (pairs.length > 0 && currentIndex < pairs.length) {
            const currentPair = pairs[currentIndex];
            if (showJaToggle.checked && currentPair.ja) {
                currentJaDiv.textContent = currentPair.ja;
                currentJaDiv.style.display = 'block';
            } else {
                currentJaDiv.textContent = "";
                currentJaDiv.style.display = 'none';
            }
        }
    });

    window.addEventListener('beforeunload', () => {
        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);
        releaseWakeLock();
    });
</script>

</body>
</html>
