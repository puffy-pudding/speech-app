<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語スピーチプレイヤー</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --accent-color: #f59e0b;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 12px;
            text-align: center;
            color: var(--primary-color);
        }

        .instruction {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .textarea-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .textarea-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #64748b;
        }

        .btn-clear-text {
            background: none;
            border: 1px solid #cbd5e1;
            color: #64748b;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-clear-text:hover {
            background-color: #fee2e2;
            color: var(--danger-color);
            border-color: #fca5a5;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 12px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #64748b;
        }

        select, input[type="range"] {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #fff;
        }

        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.9rem;
            text-align: center;
            color: #64748b;
            min-height: 1.2em;
            margin-bottom: 12px;
        }

        .display-box {
            padding: 14px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .sentence-en {
            font-size: 1.15rem;
            font-weight: bold;
            line-height: 1.4;
            color: #1e293b;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .sentence-ja {
            font-size: 0.92rem;
            color: #475569;
            line-height: 1.4;
            word-break: break-word;
        }

        .playlist-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            background: #fff;
        }

        .playlist-item {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .playlist-item:last-child {
            border-bottom: none;
        }

        .playlist-item:hover {
            background-color: #f8fafc;
        }

        .playlist-item.active {
            background-color: #dbeafe;
            border-left: 4px solid var(--primary-color);
        }

        .playlist-content {
            flex: 1;
        }

        .playlist-en {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
        }

        .playlist-ja {
            font-size: 0.82rem;
            color: #64748b;
            margin-top: 2px;
        }

        .bookmark-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #cbd5e1;
            padding: 0 4px;
            flex: none;
        }

        .bookmark-btn.bookmarked {
            color: var(--accent-color);
        }

        .playlist-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>English Speech Player</h1>
    <div class="instruction">
        【使い方】英語のみ、または「英語の行のすぐ下に日本語訳」を交互に入力してください。（自動保存されます）
    </div>
    
    <div class="textarea-header">
        <span class="textarea-label">原稿入力エリア</span>
        <button id="clear-btn" class="btn-clear-text">🗑️ すべてクリア</button>
    </div>
    <textarea id="text-input" placeholder="ここに英文を入力してください...&#10;日本語訳..."></textarea>

    <div class="controls">
        <div class="control-group">
            <label for="rate">再生速度: <span id="rate-val">1.0</span>x</label>
            <input type="range" id="rate" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label for="pause-mode">文間のポーズ</label>
            <select id="pause-mode">
                <option value="none">ポーズなし (0秒)</option>
                <option value="short">ポーズあり (短め)</option>
                <option value="normal" selected>ポーズあり (標準・可変)</option>
                <option value="long">ポーズあり (長め)</option>
            </select>
        </div>

        <div class="control-group" style="grid-column: span 2;">
            <label for="loop-mode">再生回数</label>
            <select id="loop-mode">
                <option value="1">1回</option>
                <option value="2">2回</option>
                <option value="3" selected>3回</option>
                <option value="4">4回</option>
                <option value="5">5回</option>
                <option value="infinite">無限ループ (永遠)</option>
            </select>
        </div>
    </div>

    <div class="options-row">
        <label class="checkbox-group">
            <input type="checkbox" id="show-ja-toggle" checked>
            日本語訳を表示する
        </label>
        <label class="checkbox-group">
            <input type="checkbox" id="bookmark-only-toggle">
            ★ブックマークのみ再生
        </label>
    </div>

    <div class="btn-group">
        <button id="play-btn" class="btn-primary">再生</button>
        <button id="stop-btn" class="btn-secondary" disabled>停止</button>
    </div>

    <div id="status" class="status">準備完了</div>
    
    <div class="display-box">
        <div id="current-en" class="sentence-en">再生される英文がここに表示されます</div>
        <div id="current-ja" class="sentence-ja" style="display: none;">日本語訳がここに表示されます</div>
    </div>

    <div class="playlist-title">文章一覧（タップしてその文から再生・☆でブックマーク）</div>
    <div id="playlist-container" class="playlist-container">
        <!-- 動的にリストが生成されます -->
    </div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const clearBtn = document.getElementById('clear-btn');
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');
    const rateInput = document.getElementById('rate');
    const rateVal = document.getElementById('rate-val');
    const pauseMode = document.getElementById('pause-mode');
    const loopMode = document.getElementById('loop-mode');
    const showJaToggle = document.getElementById('show-ja-toggle');
    const bookmarkOnlyToggle = document.getElementById('bookmark-only-toggle');
    const statusDiv = document.getElementById('status');
    const currentEnDiv = document.getElementById('current-en');
    const currentJaDiv = document.getElementById('current-ja');
    const playlistContainer = document.getElementById('playlist-container');

    let allPairs = [];
    let activePairs = [];
    let currentIndex = 0;
    let currentRepeatCount = 1;
    let isPlaying = false;
    let currentUtterance = null;
    let pauseTimeout = null;
    let wakeLock = null;

    const STORAGE_KEY = 'english_player_text';
    const BOOKMARK_KEY = 'english_player_bookmarks';

    window.addEventListener('DOMContentLoaded', () => {
        const savedText = localStorage.getItem(STORAGE_KEY);
        if (savedText) {
            textInput.value = savedText;
        }
        updatePlaylistPreview();
    });

    textInput.addEventListener('input', () => {
        localStorage.setItem(STORAGE_KEY, textInput.value);
        updatePlaylistPreview();
    });

    // クリアボタンの処理
    clearBtn.addEventListener('click', () => {
        if (textInput.value.trim() !== "" && confirm("入力されている文章をすべて消去しますか？")) {
            textInput.value = "";
            localStorage.removeItem(STORAGE_KEY);
            updatePlaylistPreview();
            currentEnDiv.textContent = "再生される英文がここに表示されます";
            currentJaDiv.textContent = "日本語訳がここに表示されます";
            currentJaDiv.style.display = 'none';
            statusDiv.textContent = "テキストをクリアしました";
        }
    });

    rateInput.addEventListener('input', () => {
        rateVal.textContent = rateInput.value;
    });

    function loadBookmarks() {
        try {
            return JSON.parse(localStorage.getItem(BOOKMARK_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveBookmarks(bookmarks) {
        localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmarks));
    }

    function parseText() {
        const text = textInput.value;
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        let result = [];
        let bookmarks = loadBookmarks();
        
        let i = 0;
        while (i < lines.length) {
            let currentLine = lines[i];
            let nextLine = (i + 1 < lines.length) ? lines[i + 1] : "";
            
            let hasJapanese = /[ひらがなカタカナ漢字]/.test(nextLine) || /[ぁ-んァ-ンー一-龯]/.test(nextLine);

            let en = "";
            let ja = "";

            if (hasJapanese) {
                en = currentLine;
                ja = nextLine;
                i += 2;
            } else {
                en = currentLine;
                ja = "";
                i += 1;
            }

            let isBookmarked = bookmarks.includes(en);

            const subSentences = en.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 0);
            if (subSentences.length > 1 && !hasJapanese) {
                subSentences.forEach((sub, idx) => {
                    result.push({ en: sub, ja: idx === 0 ? ja : "", bookmarked: bookmarks.includes(sub) });
                });
            } else {
                result.push({ en: en, ja: ja, bookmarked: isBookmarked });
            }
        }
        return result;
    }

    function updatePlaylistPreview() {
        allPairs = parseText();
        playlistContainer.innerHTML = '';

        if (allPairs.length === 0) {
            playlistContainer.innerHTML = '<div style="padding: 12px; color: #94a3b8; text-align:center;">英文を入力するとここにリストが表示されます</div>';
            return;
        }

        allPairs.forEach((pair, index) => {
            const item = document.createElement('div');
            item.className = `playlist-item ${isPlaying && activePairs[currentIndex] === pair ? 'active' : ''}`;
            
            item.addEventListener('click', (e) => {
                if (e.target.closest('.bookmark-btn')) return;
                jumpToSentence(index);
            });

            const content = document.createElement('div');
            content.className = 'playlist-content';

            const enDiv = document.createElement('div');
            enDiv.className = 'playlist-en';
            enDiv.textContent = `${index + 1}. ${pair.en}`;
            content.appendChild(enDiv);

            if (pair.ja) {
                const jaDiv = document.createElement('div');
                jaDiv.className = 'playlist-ja';
                jaDiv.textContent = pair.ja;
                content.appendChild(jaDiv);
            }

            const bmBtn = document.createElement('button');
            bmBtn.className = `bookmark-btn ${pair.bookmarked ? 'bookmarked' : ''}`;
            bmBtn.innerHTML = pair.bookmarked ? '★' : '☆';
            bmBtn.title = "ブックマーク";
            bmBtn.addEventListener('click', () => {
                toggleBookmark(pair.en);
            });

            item.appendChild(content);
            item.appendChild(bmBtn);
            playlistContainer.appendChild(item);
        });
    }

    function toggleBookmark(enText) {
        let bookmarks = loadBookmarks();
        if (bookmarks.includes(enText)) {
            bookmarks = bookmarks.filter(b => b !== enText);
        } else {
            bookmarks.push(enText);
        }
        saveBookmarks(bookmarks);
        updatePlaylistPreview();
    }

    function calculatePauseDuration(sentence) {
        const mode = pauseMode.value;
        if (mode === 'none') return 0;

        const wordCount = sentence.trim().split(/\s+/).length;
        let basePause = wordCount * 300;
        basePause = Math.max(1000, Math.min(basePause, 15000));

        if (mode === 'short') return basePause * 0.8;
        if (mode === 'long') return basePause * 1.3;
        return basePause;
    }

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {
                console.warn('Wake Lock Error:', err);
            }
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release().then(() => {
                wakeLock = null;
            });
        }
    }

    function speakNext() {
        if (!isPlaying) return;

        if (currentIndex >= activePairs.length) {
            const maxLoop = loopMode.value;
            if (maxLoop === 'infinite') {
                currentIndex = 0;
            } else {
                if (currentRepeatCount < parseInt(maxLoop)) {
                    currentRepeatCount++;
                    currentIndex = 0;
                } else {
                    stopPlayback();
                    statusDiv.textContent = "再生終了";
                    return;
                }
            }
        }

        const currentPair = activePairs[currentIndex];
        currentEnDiv.textContent = currentPair.en;
        
        if (showJaToggle.checked && currentPair.ja) {
            currentJaDiv.textContent = currentPair.ja;
            currentJaDiv.style.display = 'block';
        } else {
            currentJaDiv.textContent = "";
            currentJaDiv.style.display = 'none';
        }

        updateActivePlaylistUI(currentPair);

        const loopInfo = loopMode.value === 'infinite' ? '∞' : `${currentRepeatCount}/${loopMode.value}回`;
        statusDiv.textContent = `再生中 [周回: ${loopInfo}] (文: ${currentIndex + 1}/${activePairs.length})`;

        currentUtterance = new SpeechSynthesisUtterance(currentPair.en);
        currentUtterance.lang = 'en-US';
        currentUtterance.rate = parseFloat(rateInput.value);

        currentUtterance.onend = () => {
            if (!isPlaying) return;
            currentIndex++;
            
            const pauseMs = calculatePauseDuration(currentPair.en);
            if (pauseMs === 0) {
                speakNext();
            } else {
                const secondsText = (pauseMs / 1000).toFixed(1);
                statusDiv.textContent = `ポーズ中 (${secondsText}秒)...`;
                pauseTimeout = setTimeout(speakNext, pauseMs);
            }
        };

        currentUtterance.onerror = (e) => {
            console.error('Speech synthesis error:', e);
            if (isPlaying) {
                currentIndex++;
                speakNext();
            }
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    function updateActivePlaylistUI(activePair) {
        const items = playlistContainer.querySelectorAll('.playlist-item');
        items.forEach((item, idx) => {
            if (activePairs[currentIndex] === allPairs[idx]) {
                item.classList.add('active');
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                item.classList.remove('active');
            }
        });
    }

    function jumpToSentence(allPairsIndex) {
        const targetPair = allPairs[allPairsIndex];
        prepareActivePairs();

        const targetActiveIndex = activePairs.indexOf(targetPair);
        if (targetActiveIndex === -1) {
            if (bookmarkOnlyToggle.checked) {
                alert("この文はブックマークされていないため、現在の「★ブックマークのみ再生」モードでは再生対象外です。");
                return;
            }
            return;
        }

        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);

        currentIndex = targetActiveIndex;
        if (!isPlaying) {
            startPlaybackSequence();
        } else {
            speakNext();
        }
    }

    function prepareActivePairs() {
        allPairs = parseText();
        if (bookmarkOnlyToggle.checked) {
            activePairs = allPairs.filter(p => p.bookmarked);
        } else {
            activePairs = [...allPairs];
        }
    }

    function startPlaybackSequence() {
        prepareActivePairs();
        if (activePairs.length === 0) {
            alert(bookmarkOnlyTitleAlert());
            return;
        }

        currentIndex = 0;
        currentRepeatCount = 1;
        isPlaying = true;

        playBtn.disabled = true;
        stopBtn.disabled = false;
        pauseMode.disabled = true;
        loopMode.disabled = true;
        textInput.disabled = true;
        bookmarkOnlyToggle.disabled = true;
        clearBtn.disabled = true;

        requestWakeLock();
        speakNext();
    }

    function bookmarkOnlyTitleAlert() {
        return bookmarkOnlyToggle.checked ? "ブックマークされた文がありません。" : "再生する英文がありません。";
    }

    playBtn.addEventListener('click', () => {
        startPlaybackSequence();
    });

    function stopPlayback() {
        isPlaying = false;
        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);
        releaseWakeLock();

        playBtn.disabled = false;
        stopBtn.disabled = true;
        pauseMode.disabled = false;
        loopMode.disabled = false;
        textInput.disabled = false;
        bookmarkOnlyToggle.disabled = false;
        clearBtn.disabled = false;

        statusDiv.textContent = "停止中";
        updatePlaylistPreview();
    }

    stopBtn.addEventListener('click', stopPlayback);

    showJaToggle.addEventListener('change', () => {
        if (activePairs.length > 0 && currentIndex < activePairs.length) {
            const currentPair = activePairs[currentIndex];
            if (showJaToggle.checked && currentPair.ja) {
                currentJaDiv.textContent = currentPair.ja;
                currentJaDiv.style.display = 'block';
            } else {
                currentJaDiv.textContent = "";
                currentJaDiv.style.display = 'none';
            }
        }
    });

    window.addEventListener('beforeunload', () => {
        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);
        releaseWakeLock();
    });
</script>

</body>
</html>
