<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語スピーチプレイヤー</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 16px;
            text-align: center;
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            box-sizing: border-box;
            resize: vertical;
            margin-bottom: 16px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        select, input[type="range"] {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.9rem;
            text-align: center;
            color: #64748b;
            min-height: 1.2em;
        }

        .sentence-display {
            margin-top: 16px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.4;
            min-height: 3em;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>English Speech Player</h1>
    
    <textarea id="text-input" placeholder="ここに英文を入力してください..."></textarea>

    <div class="controls">
        <div class="control-group">
            <label for="rate">再生速度: <span id="rate-val">1.0</span>x</label>
            <input type="range" id="rate" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label for="pause-mode">文間のポーズ設定</label>
            <select id="pause-mode">
                <option value="none">ポーズなし (0秒)</option>
                <option value="short">ポーズあり (短め)</option>
                <option value="normal" selected>ポーズあり (標準・可変)</option>
                <option value="long">ポーズあり (長め)</option>
            </select>
        </div>
    </div>

    <div class="btn-group">
        <button id="play-btn" class="btn-primary">再生</button>
        <button id="stop-btn" class="btn-secondary" disabled>停止</button>
    </div>

    <div id="status" class="status">準備完了</div>
    <div id="current-sentence" class="sentence-display">再生される文章がここに表示されます</div>
</div>

<script>
    const textInput = document.getElementById('text-input');
    const playBtn = document.getElementById('play-btn');
    const stopBtn = document.getElementById('stop-btn');
    const rateInput = document.getElementById('rate');
    const rateVal = document.getElementById('rate-val');
    const pauseMode = document.getElementById('pause-mode');
    const statusDiv = document.getElementById('status');
    const currentSentenceDiv = document.getElementById('current-sentence');

    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let currentUtterance = null;
    let pauseTimeout = null;

    rateInput.addEventListener('input', () => {
        rateVal.textContent = rateInput.value;
    });

    function splitText(text) {
        return text.split(/(?<=[.!?])\s+|\n+/).filter(s => s.trim().length > 0);
    }

    // 単語数に応じた可変ポーズ時間の計算 (ミリ秒)
    function calculatePauseDuration(sentence) {
        const mode = pauseMode.value;
        if (mode === 'none') return 0; // ポーズなし

        // 単語数をカウント（空白区切り）
        const wordCount = sentence.trim().split(/\s+/).length;
        
        // 1単語あたり約300ミリ秒（0.3秒）のポーズを基本とする
        let basePause = wordCount * 300;
        
        // 最低でも1秒は確保、最長でも15秒に抑える
        basePause = Math.max(1000, Math.min(basePause, 15000));

        // モードによる倍率調整
        if (mode === 'short') return basePause * 0.8;
        if (mode === 'long') return basePause * 1.3;
        return basePause; // normal
    }

    function speakNext() {
        if (!isPlaying || currentIndex >= sentences.length) {
            stopPlayback();
            statusDiv.textContent = "再生終了";
            return;
        }

        const sentence = sentences[currentIndex].trim();
        currentSentenceDiv.textContent = sentence;
        statusDiv.textContent = `再生中 (${currentIndex + 1}/${sentences.length})`;

        currentUtterance = new SpeechSynthesisUtterance(sentence);
        currentUtterance.lang = 'en-US';
        currentUtterance.rate = parseFloat(rateInput.value);

        currentUtterance.onend = () => {
            if (!isPlaying) return;
            currentIndex++;
            
            const pauseMs = calculatePauseDuration(sentence);
            if (pauseMs === 0) {
                speakNext();
            } else {
                const secondsText = (pauseMs / 1000).toFixed(1);
                statusDiv.textContent = `ポーズ中 (${secondsText}秒)... (${currentIndex}/${sentences.length})`;
                pauseTimeout = setTimeout(speakNext, pauseMs);
            }
        };

        currentUtterance.onerror = (e) => {
            console.error('Speech synthesis error:', e);
            if (isPlaying) {
                currentIndex++;
                speakNext();
            }
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    playBtn.addEventListener('click', () => {
        const text = textInput.value;
        if (!text.trim()) return;

        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);

        sentences = splitText(text);
        if (sentences.length === 0) return;

        currentIndex = 0;
        isPlaying = true;

        playBtn.disabled = true;
        stopBtn.disabled = false;
        pauseMode.disabled = true;

        speakNext();
    });

    function stopPlayback() {
        isPlaying = false;
        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);

        playBtn.disabled = false;
        stopBtn.disabled = true;
        pauseMode.disabled = false;

        statusDiv.textContent = "停止中";
    }

    stopBtn.addEventListener('click', stopPlayback);

    window.addEventListener('beforeunload', () => {
        window.speechSynthesis.cancel();
        clearTimeout(pauseTimeout);
    });
</script>

</body>
</html>
